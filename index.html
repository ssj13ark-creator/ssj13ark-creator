
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            text-align: center;
            padding: 50px;
        }

        .contenedor {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>¡Hola, mundo!</h1>

        <p>Esta es mi primera página HTML.</p>

        <button onclick="saludar()">
            Haz clic aquí
        </button>
    </div>

    <script>
        function saludar() {
            alert("¡Bienvenido a mi página web!");
        }
    </script>

</body>
</html>
